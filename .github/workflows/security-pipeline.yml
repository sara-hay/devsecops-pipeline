name: Security Pipeline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: secops-pipeline-demo
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  # ---------------------------------------------------------
  # 1. Build the Docker image and pass it to downstream jobs
  #    via a saved tarball artifact (keeps jobs isolated/parallel-friendly).
  # ---------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Save image to tarball
        run: docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 5

  # ---------------------------------------------------------
  # 2. Semgrep SAST scan on the Python source
  # ---------------------------------------------------------
  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-results.json \
            .
        continue-on-error: true # don't block the job; we'll gate on this later

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 5

  # ---------------------------------------------------------
  # 3. Trivy SCA + container scan on the built image
  # ---------------------------------------------------------
  trivy-scan:
    name: Trivy SCA & Container Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0 # don't block the job; we'll gate on this later

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 5

  # ---------------------------------------------------------
  # 4. Policy-as-code gate: parse Semgrep + Trivy results and
  #    fail the build if any Critical-severity finding exists
  # ---------------------------------------------------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [semgrep-sast, trivy-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Semgrep results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results

      - name: Download Trivy results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run security gate
        run: python security_gate.py --semgrep semgrep-results.json --trivy trivy-results.json
