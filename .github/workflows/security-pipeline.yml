name: Security Pipeline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: secops-pipeline-demo
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  # ---------------------------------------------------------
  # 1. Build the Docker image and pass it to downstream jobs
  #    via a saved tarball artifact (keeps jobs isolated/parallel-friendly).
  # ---------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Save image to tarball
        run: docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 5

  # ---------------------------------------------------------
  # 2. Semgrep SAST scan on the Python source
  # ---------------------------------------------------------
  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-results.json \
            .
        continue-on-error: true # don't block the job; we'll gate on this later

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 5

  # ---------------------------------------------------------
  # 3. Trivy SCA + container scan on the built image
  # ---------------------------------------------------------
  trivy-scan:
    name: Trivy SCA & Container Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0 # pin Trivy binary; older releases' assets were removed upstream
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0 # don't block the job; we'll gate on this later

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 5

  # ---------------------------------------------------------
  # 4. Policy-as-code gate: parse Semgrep + Trivy results and
  #    fail the build if any Critical-severity finding exists
  # ---------------------------------------------------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [semgrep-sast, trivy-scan]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Semgrep results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results

      - name: Download Trivy results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install boto3
        run: pip install boto3


      - name: Debug OIDC claims
        run: |
          python3 - <<'EOF'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          tok = json.load(urllib.request.urlopen(req))["value"]
          payload = tok.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print({k: claims.get(k) for k in ("iss", "aud", "sub", "repository", "event_name", "ref")})
          EOF
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::753036488457:role/GitHubActions-DynamoDB-Write
          aws-region: us-east-1

      - name: Run security gate
        run: python security_gate.py --semgrep semgrep-results.json --trivy trivy-results.json --region us-east-1
